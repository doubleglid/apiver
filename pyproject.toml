[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleglid-apiver"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对API 版本路由的兼容层相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "doubleglid" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://doubleglid.github.io"
Repository = "https://github.com/doubleglid/apiver"
Issues = "https://github.com/doubleglid/apiver/issues"

[project.scripts]
apiver = "apiver:main"

[tool.setuptools]
py-modules = ["apiver"]
